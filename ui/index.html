      /** Color de cada programa, dentro de la paleta. El estado manda si no está bien. */
      const PART_COLORS = {
        radarr: 'gold',
        sonarr: 'blue',
        prowlarr: 'gold',
        bazarr: 'purple',
        qbittorrent: 'blue',
        jellyfin: 'purple',
        seerr: 'purple',
        bot: 'blue',
        tailscale: 'green',
      };

      const DISK_COLORS = ['purple', 'blue', 'gold', 'green'];

      const SVG_NS = 'http://www.w3.org/2000/svg';

      function el(tag, className, ...children) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        node.append(...children.filter((child) => child !== null && child !== undefined));
        return node;
      }

      function svgNode(tag, attributes = {}) {
        const node = document.createElementNS(SVG_NS, tag);
        for (const [name, value] of Object.entries(attributes)) node.setAttribute(name, value);
        return node;
      }

      /** Único camino para dibujar un icono. Los trazos son constantes de este archivo, nunca datos. */
      function icon(name, size = 18) {
        const node = svgNode('svg', { class: 'lucide', width: size, height: size, viewBox: '0 0 24 24', 'aria-hidden': 'true' });
        node.innerHTML = ICONS[name];
        return node;
      }

      /** Con color de la paleta: lo usan las tarjetas, las gráficas y los discos. */
      function tinted(node, color) {
        node.style.setProperty('--c', `var(--${color})`);
        return node;
      }

      function brand(kind) {
        const reel = svgNode('svg', { class: 'brand-reel', viewBox: '0 0 64 64', 'aria-hidden': 'true' });
        reel.append(svgNode('use', { href: '#art-reel' }));
        const [first, second] = brandParts(PRODUCT_NAME);
        const words = el('div', null, el('div', 'brand-name', first, el('span', null, second)), el('div', 'brand-sub', 'MEDIA CENTER'));
        return [reel, words];
      }

      function art(symbol, viewBox, className) {
        const node = svgNode('svg', { class: className, viewBox, 'aria-hidden': 'true' });
        node.append(svgNode('use', { href: symbol }));
        return node;
      }

      /** El logo del programa. Sin logo, nada: el nombre ya está al lado. */
      function partLogo(part) {
        const box = el('span', part.id === 'tailscale' ? 'logo light-mark' : 'logo');
        if (LOGOS[part.id]) {
          const image = el('img');
          image.alt = '';
          image.src = LOGOS[part.id];
          box.append(image);
        }
        return box;
      }

      /**
       * Gráfica de línea con muestras reales. Siempre lleva su línea base; sin muestras, solo eso.
       * scale: min, max y minSpan de sparkPoints.
       */
      function sparkline(values, color, scale = {}) {
        const width = 100;
        const height = 30;
        const node = svgNode('svg', { class: 'spark', viewBox: `0 0 ${width} ${height}`, preserveAspectRatio: 'none', 'aria-hidden': 'true' });
        tinted(node, color);
        node.append(svgNode('line', { class: 'spark-base', x1: 0, x2: width, y1: height - 0.5, y2: height - 0.5 }));
        const points = sparkPoints(values, { width, height, ...scale });
        const line = sparkPath(points);
        if (line) {
          node.append(
            svgNode('path', { d: `${line}L${width} ${height}L${points[0].x.toFixed(2)} ${height}Z`, fill: `url(#spark-${color})` }),
            svgNode('path', { class: 'spark-line', d: line }),
          );
        }
        return node;
      }

      /** Barras de la velocidad: una por muestra, alineadas a la derecha, y lo que falta queda como línea base. */
      function activityBars(values, slots = 40) {
        const recent = values.slice(-slots);
        const top = Math.max(...recent, 1);
        const missing = Array.from({ length: slots - recent.length }, () => el('i', 'off'));
        const bars = recent.map((value) => {
          const bar = el('i', value > 0 ? null : 'off');
          if (value > 0) bar.style.height = `${Math.max(4, Math.round((value / top) * 100))}%`;
          return bar;
        });
        const node = el('div', 'bars', ...missing, ...bars);
        node.setAttribute('aria-hidden', 'true');
        return node;
      }

      function stateBadge(part) {
        return el('span', `state state-${part.state}`, statusWord(part.state));
      }

      function liveBadge(on) {
        return el('span', `state live panel-meta${on ? '' : ' off'}`, on ? 'Live' : NO_DATA);
      }

      function issueList(messages, danger = false) {
        if (!messages.length) return null;
        const list = el('ul', danger ? 'issues danger' : 'issues');
        list.append(...messages.map((message) => el('li', null, message)));
        return list;
      }

      function panel(iconName, title, meta, ...body) {
        return el('article', 'panel', el('div', 'panel-head', icon(iconName, 17), el('h3', null, title), meta), ...body);
      }

      function statBox(value, label) {
        return el('div', 'stat', el('strong', null, value), el('span', null, label));
      }

      /** Color del programa según su estado: rojo si está caído, amarillo si tiene avisos. */
      function partColor(part) {
        if (part.state === 'down') return 'red';
        if (part.state !== 'ok') return 'yellow';
        return PART_COLORS[part.id] ?? 'purple';
      }

      function partSpark(part) {
        return sparkline(samples(`part:${part.id}`), partColor(part), { min: 0, max: 1.25 });
      }

      // --- Overview ---
      const shownMetrics = new Map();

      function metricCard({ key, iconName, color, value, unit, label, note, view, spark }) {
        const number = el('span', 'metric-value', value, unit ? el('small', null, unit) : null);
        const shown = value + (unit ?? '');
        if (shownMetrics.has(key) && shownMetrics.get(key) !== shown) number.classList.add('bump');
        shownMetrics.set(key, shown);
        const card = el(
          'button',
          'metric',
          el('span', 'metric-icon', icon(iconName, 30)),
          el('span', 'metric-text', number, el('span', 'metric-label', label), note ? el('span', 'metric-note', note) : null),
          spark,
        );
        card.type = 'button';
        tinted(card, color);
        card.addEventListener('click', () => showView(view));
        return card;
      }

      function renderMetrics(status) {
        const parts = status?.parts ?? [];
        const usage = status ? storageUsage(status.disks.items) : null;
        const today = status ? downloadsToday(status.downloads) : { value: NO_DATA, note: null };
        const pending = status && !status.requests.error ? String(status.requests.total) : NO_DATA;
        $('metrics').replaceChildren(
          metricCard({
            key: 'services',
            iconName: 'circle-check',
            color: 'green',
            value: status ? String(servicesOnline(parts)) : NO_DATA,
            unit: status ? ` / ${parts.length}` : null,
            label: 'Services Online',
            view: 'services',
            spark: sparkline(samples('services'), 'green', { min: 0, max: Math.max(parts.length, 1) * 1.25 }),
          }),
          metricCard({
            key: 'requests',
            iconName: 'clapperboard',
            color: 'purple',
            value: pending,
            label: 'Requests Pending',
            note: status?.requests.error ? 'Seerr no respondió' : null,
            view: 'requests',
            spark: sparkline(samples('requests'), 'purple', { minSpan: 2 }),
          }),
          metricCard({
            key: 'today',
            iconName: 'download',
            color: 'blue',
            value: today.value,
            label: 'Downloads Today',
            note: today.note,
            view: 'downloads',
            spark: sparkline(samples('today'), 'blue', { minSpan: 2 }),
          }),
          metricCard({
            key: 'storage',
            iconName: 'database',
            color: 'gold',
            value: usage ? String(usage.percent) : NO_DATA,
            unit: usage ? '%' : null,
            label: 'Storage Used',
            note: status && !usage ? 'Sin datos de los discos' : null,
            view: 'storage',
            spark: sparkline(samples('storage'), 'gold', { minSpan: 2 }),
          }),
        );
      }

      function serviceTile(part) {
        const uptime = partUptime(part);
        const tile = el(
          'button',
          'tile',
          partLogo(part),
          el(
            'span',
            'tile-text',
            el('span', 'tile-name', part.name),
            stateBadge(part),
            el('span', 'tile-uptime', uptime === NO_DATA ? NO_DATA : `${uptime} uptime`),
          ),
          partSpark(part),
        );
        tile.type = 'button';
        tile.title = `Ver ${part.name} en Services`;
        tinted(tile, partColor(part));
        tile.addEventListener('click', () => showPart(part.id));
        // La flecha va al lado y no adentro: un botón no puede contener otro.
        const open = openServiceButton(part);
        return el('div', `tile-wrap${open ? ' has-open' : ''}`, tile, open);
      }

      function diskRow(disk, index) {
        const percent = diskPercent(disk);
        return tinted(
          el(
            'div',
            'disk',
            el(
              'div',
              'disk-line',
              el('span', 'disk-name', diskName(disk)),
              el('span', `disk-percent${disk.low ? ' low' : ''}`, `${percent}%`),
            ),
            progressBar(percent / 100),
            el('div', 'disk-facts', `${formatBytes(disk.totalBytes)} · ${formatBytes(disk.totalBytes - disk.freeBytes)} used · ${formatBytes(disk.freeBytes)} free`),
          ),
          DISK_COLORS[index % DISK_COLORS.length],
        );
      }

      function storagePanel(disks) {
        const usage = storageUsage(disks.items);
        return panel(
          'database',
          'STORAGE VAULT',
          usage ? el('span', 'panel-meta gold', `${usage.percent}% Used`) : null,
          ...disks.items.map(diskRow),
          usage
            ? el('div', 'panel-foot', icon('hard-drive', 14), `${formatBytes(usage.freeBytes)} Free of ${formatBytes(usage.totalBytes)}`)
            : issueList([disks.detail ?? 'Sin datos de los discos'], true),
        );
      }

      /** Barras y datos de la actividad: los usa el panel de Overview y la vista Downloads. */
      function activityBody(status) {
        const note = transferNote(status);
        return [
          activityBars(samples('down')),
          note ? el('p', `note${status.transferBlocked ? ' warn' : ''}`, note) : null,
          el(
            'div',
            'stat-row',
            note ? null : statBox(formatSpeed(status.transfer.downloadBps), 'Current Speed'),
            statBox(downloadsToday(status.downloads).value, 'Today'),
            statBox(String(status.downloads.items.length), 'In queue'),
          ),
        ];
      }

      function downloadPanel(status) {
        return panel('download', 'DOWNLOAD ACTIVITY', liveBadge(Boolean(status.transfer)), ...activityBody(status));
      }

      /** Miniatura del pedido. Si no hay o no carga, queda el marcador que tiene detrás. */
      function requestPoster(request, size) {
        const box = el('span', 'poster', icon('clapperboard', size));
        const url = posterUrl(request.posterPath);
        if (url) {
          const image = el('img');
          image.alt = '';
          image.referrerPolicy = 'no-referrer';
          image.addEventListener('error', () => image.remove());
          image.src = url;
          box.append(image);
        }
        return box;
      }

      function requestTitle(request) {
        return request.year ? `${request.title} (${request.year})` : request.title;
      }

      function queuePanel(requests, seerrUsable) {
        const body = requests.error
          ? [issueList([`No se pudieron leer los pedidos: ${requests.error}`], true)]
          : requests.items.length
            ? requests.items.slice(0, 3).map((request) =>
                el(
                  'div',
                  'request',
                  requestPoster(request, 14),
                  el('div', 'request-text', el('span', 'request-title', requestTitle(request))),
                  el('span', 'request-age', timeAgo(request.createdAt)),
                ),
              )
            : [el('p', 'note', 'No hay pedidos sin completar.')];
        const all = el('button', 'link-button', 'View all requests', icon('arrow-right', 14));
        all.type = 'button';
        all.addEventListener('click', () => showView('requests'));
        const seerr = el('button', 'link-button needs-pc', 'Abrir Seerr', icon('arrow-up-right', 14));
        seerr.type = 'button';
        seerr.disabled = !seerrUsable;
        seerr.addEventListener('click', openSeerr);
        return panel(
          'list',
          'REQUEST QUEUE',
          requests.error ? null : el('span', 'panel-meta pill', String(requests.total)),
          ...body,
          el('div', 'queue-foot', all, seerr),
        );
      }

      /** Una IP con su botón de copiar. */
      function ipRow(label, value) {
        const copy = el('button', 'icon-button', icon('copy', 14));
        copy.type = 'button';
        copy.title = `Copiar ${label}`;
        copy.setAttribute('aria-label', copy.title);
        copy.hidden = !value;
        copy.addEventListener('click', () => copyText(copy, value, 'Copiada: ' + value));
        return el('div', 'ip-row', el('div', null, el('span', 'ip-label', label), el('span', 'ip-value', value ?? 'No detectada')), copy);
      }

      function transferLine(iconName, label, value) {
        return el('div', 'transfer-line', icon(iconName, 15), el('div', null, el('span', null, label), el('strong', null, value)));
      }

      function transferBlock(status) {
        const note = transferNote(status);
        return el(
          'div',
          'transfer',
          // Si qBittorrent pide contraseña, la nota va en lugar de la velocidad.
          status.transferBlocked ? null : transferLine('arrow-up', 'Upload', formatSpeed(status.transfer?.uploadBps)),
          status.transferBlocked ? null : transferLine('arrow-down', 'Download', formatSpeed(status.transfer?.downloadBps)),
          note ? el('p', `note${status.transferBlocked ? ' warn' : ''}`, note) : null,
        );
      }

      function networkPanel(status) {
        return panel(
          'wifi',
          'NETWORK STATUS',
          null,
          art('#art-globe', '0 0 200 200', 'panel-art'),
          ipRow('Local IP', status.network.lanIp),
          ipRow('Tailscale IP', status.network.tailscaleIp),
          transferBlock(status),
        );
      }

      function renderOverview(status) {
        renderMetrics(status);
        $('monitored').textContent = servicesMonitored(status.parts);
        $('room').replaceChildren(...status.parts.map(serviceTile));
        $('panels').replaceChildren(
          storagePanel(status.disks),
          downloadPanel(status),
          queuePanel(status.requests, seerrPart()?.state !== 'down'),
          networkPanel(status),
        );
      }

      // --- Services ---
      function partCard(part) {
        const uptime = partUptime(part);
        const stateNote = part.stateText ?? (part.state === 'error' ? stateLabel(part.state) : null);
        const card = el(
          'article',
          'card',
          el(
            'div',
            'card-head',
            el('div', 'part-title', partLogo(part), el('div', null, el('h3', null, part.name), stateBadge(part))),
            openServiceButton(part),
          ),
          PART_PURPOSE[part.id] ? el('p', 'muted small part-purpose', PART_PURPOSE[part.id]) : null,
          el('p', 'muted small', uptime === NO_DATA ? `Uptime: ${NO_DATA} (${part.state === 'down' ? 'no está corriendo' : 'sin dato de inicio'})` : `Uptime: ${uptime}`),
          part.version ? el('p', 'muted small', `Versión ${part.version}`) : null,
          stateNote ? el('p', 'muted small', stateNote) : null,
          part.detail ? el('p', 'muted small', part.detail) : null,
          issueList(part.issues.map((issue) => issue.message)),
          el('div', 'part-spark', el('p', 'note', 'Disponibilidad'), tinted(partSpark(part), partColor(part))),
          partFooter(part),
        );
        card.dataset.part = part.id;
        return card;
      }

      /** Flecha para abrir la web del programa en el navegador. El bot y Tailscale no tienen web. */
      function openServiceButton(part) {
        if (!part.port) return null;
        const button = el('button', 'open-service', icon('arrow-up-right', 16));
        button.type = 'button';
        button.title = `Abrir ${part.name} en el navegador`;
        button.setAttribute('aria-label', button.title);
        button.disabled = part.state === 'down';
        button.addEventListener('click', () => openInBrowser(serviceUrl(part.port)));
        return button;
      }

      function partFooter(part) {
        if (!part.control) return null;
        const running = busyParts.get(part.id);
        const action = running ?? availableAction(part);
        const button = el('button', 'button part-action', actionLabel(action, Boolean(running), part.control.kind));
        button.type = 'button';
        button.disabled = Boolean(running);
        button.addEventListener('click', () => runPartAction(part, action));
        const result = actionResults.get(part.id);
        const showResult = result && Date.now() < result.until;
        return el(
          'div',
          'part-end',
          showResult ? el('p', `action-result ${result.ok ? 'ok' : 'failed'}`, result.message) : null,
          el('div', 'part-footer', button),
        );
      }

      function renderParts(container, parts) {
        container.replaceChildren(...parts.map(partCard));
      }

      // --- Downloads ---
      function progressBar(ratio) {
        const fill = el('div');
        fill.style.width = `${Math.round(ratio * 100)}%`;
        return el('div', 'bar', fill);
      }

      function downloadCard(item) {
        const facts = [downloadLabel(item)];
        if (item.progress !== null) facts.push(`${Math.round(item.progress * 100)}%`);
        if (item.sizeBytes !== null) facts.push(formatBytes(item.sizeBytes));
        const timeLeft = formatTimeLeft(item.timeLeft);
        if (timeLeft) facts.push(`faltan ${timeLeft}`);
        if (item.quality) facts.push(item.quality);

        return el(
          'article',
          'card',
          el('h3', null, item.subtitle ? `${item.title} (${item.subtitle})` : item.title),
          el('p', 'muted small', facts.join(' · ')),
          item.progress !== null ? progressBar(item.progress) : null,
          issueList(item.problems, item.trackedStatus === 'error'),
        );
      }

      function pauseCard(paused) {
        const button = el('button', 'button', downloadsBusy ? 'Un momento…' : paused ? 'Reanudar descargas' : 'Pausar descargas');
        button.type = 'button';
        button.disabled = downloadsBusy;
        button.addEventListener('click', () => toggleDownloads(paused));
        const showResult = downloadsResult && Date.now() < downloadsResult.until;
        return el(
          'div',
          'pause-row',
          el('p', 'small', paused ? 'Las descargas están en pausa.' : 'Pausalas si necesitás el ancho de banda.'),
          button,
          showResult ? el('p', `action-result ${downloadsResult.ok ? 'ok' : 'failed'}`, downloadsResult.message) : null,
        );
      }

      function renderDownloads(container, downloads, paused = false) {
        const nodes = [pauseCard(paused)];
        if (downloads.errors.length) {
          nodes.push(issueList(downloads.errors.map((error) => `No se pudo leer la cola de ${error.name}: ${error.message}`), true));
        }
        if (downloads.items.length) {
          nodes.push(...downloads.items.map(downloadCard));
        } else if (!downloads.errors.length) {
          nodes.push(
            el(
              'div',
              'empty',
              el('p', null, 'No se está bajando nada.'),
              el('p', 'muted small', 'Solo se ven las colas de Radarr y Sonarr: lo agregado a mano en qBittorrent no aparece.'),
            ),
          );
        }
        if (downloads.truncated) nodes.push(el('p', 'muted small', 'Hay más descargas de las que entran en esta lista.'));
        container.replaceChildren(el('div', 'stack', ...nodes));
      }

      function renderDownloadsActivity(status) {
        const [bars, note, stats] = activityBody(status);
        $('downloads-activity').replaceChildren(
          el('article', 'card activity-card', el('div', null, bars, note), stats),
        );
      }

      // --- Requests ---
      function renderRequests(container, requests) {
        if (requests.error) {
          container.replaceChildren(issueList([`No se pudieron leer los pedidos: ${requests.error}`], true));
          return;
        }
        if (!requests.items.length) {
          container.replaceChildren(el('div', 'empty', el('p', null, 'No hay pedidos sin completar.')));
          return;
        }
        const cards = requests.items.map((request) =>
          el(
            'article',
            'card',
            el(
              'div',
              'request big',
              requestPoster(request, 20),
              el(
                'div',
                'request-text',
                el('span', 'request-title', requestTitle(request)),
                el('p', 'muted small', requestFacts(request)),
              ),
              el('span', 'request-age', timeAgo(request.createdAt)),
            ),
          ),
        );
        const hidden = requests.total - requests.items.length;
        container.replaceChildren(
          el(
            'div',
            'stack',
            ...cards,
            hidden > 0 ? el('p', 'muted small', `Y ${hidden} más: se ven todos en Seerr.`) : null,
          ),
        );
      }

      // --- Storage ---
      function renderStorageSummary(disks) {
        const usage = storageUsage(disks.items);
        $('storage-summary').replaceChildren(
          usage
            ? el(
                'article',
                'card storage-head',
                el(
                  'div',
                  'stat-row',
                  statBox(`${usage.percent}%`, 'Used'),
                  statBox(formatBytes(usage.usedBytes), 'Used space'),
                  statBox(formatBytes(usage.freeBytes), 'Free'),
                  statBox(formatBytes(usage.totalBytes), 'Total'),
                ),
                el('div', 'part-spark', el('p', 'note', 'Uso en este dispositivo'), sparkline(samples('storage'), 'gold', { minSpan: 2 })),
              )
            : '',
        );
      }

      function diskCard(disk, index) {
        return el(
          'article',
          'card',
          diskRow(disk, index),
          disk.low ? el('span', 'state state-warning', 'Poco espacio') : null,
        );
      }

      function renderDisks(container, disks) {
        if (!disks.items.length) {
          container.replaceChildren(issueList([disks.detail ?? 'Sin datos de los discos'], true));
          return;
        }
        container.replaceChildren(el('div', 'stack', ...disks.items.map(diskCard)));
      }

      // --- Network ---
      function renderNetwork(container, status) {
        const tailscale = status.parts.filter((part) => part.id === 'tailscale').map(partCard);
        container.replaceChildren(
          el(
            'div',
            'stack',
            el(
              'article',
              'card with-art',
              art('#art-globe', '0 0 200 200', 'panel-art'),
              ipRow('Local IP', status.network.lanIp),
              ipRow('Tailscale IP', status.network.tailscaleIp),
              transferBlock(status),
              el('p', 'note', 'La IP pública no se consulta: habría que llamar a un servicio externo.'),
            ),
            ...tailscale,
          ),
        );
      }

      /** Copia un texto y lo muestra en el botón. El portapapeles moderno no siempre está: hay un plan B. */
      async function copyText(button, value, message) {
        let copied = false;
        try {
          await navigator.clipboard.writeText(value);
          copied = true;
        } catch {
          const area = el('textarea');
          area.value = value;
          area.style.position = 'fixed';
          area.style.opacity = '0';
          document.body.append(area);
          area.select();
          try {
            copied = document.execCommand('copy');
          } catch {}
          area.remove();
        }
        notify(copied ? message : 'No se pudo copiar', copied ? 'green' : 'red');
        if (!copied) return;
        button.replaceChildren(icon('check', 14));
        button.classList.add('done');
        setTimeout(() => {
          button.replaceChildren(icon('copy', 14));
          button.classList.remove('done');
        }, 1500);
      }

      // --- Avisos ---
      const TOAST_MS = 6000;
      const TOAST_LIMIT = 3;

      function notify(text, color = 'purple') {
        const toast = tinted(el('div', 'toast', text), color);
        $('toasts').append(toast);
        while ($('toasts').childElementCount > TOAST_LIMIT) $('toasts').firstElementChild.remove();
        setTimeout(() => toast.remove(), TOAST_MS);
      }

      // --- Muestras ---
      // No hay historial en los programas: cada dispositivo guarda las suyas, a medida que llegan estados.
      const SAMPLES_KEY = 'lp-media-center:muestras';
      const SAMPLE_CAP = 48;
      const SAMPLE_GAP_MS = 60000;
      const SPEED_GAP_MS = 14000;

      function loadSamples() {
        try {
          const stored = JSON.parse(localStorage.getItem(SAMPLES_KEY));
          return stored && typeof stored === 'object' ? stored : {};
        } catch {
          return {};
        }
      }

      let sampleHistory = loadSamples();

      const samples = (key) => (Array.isArray(sampleHistory[key]?.values) ? sampleHistory[key].values : []);

      function recordSamples(status, now = Date.now()) {
        const add = (key, value, gap = SAMPLE_GAP_MS) => addSample(sampleHistory, key, value, now, gap, SAMPLE_CAP);
        add('services', servicesOnline(status.parts));
        add('requests', status.requests.error ? null : status.requests.total);
        add('today', status.downloads.today);
        add('storage', storageUsage(status.disks.items)?.percent);
        add('down', status.transfer?.downloadBps, SPEED_GAP_MS);
        for (const part of status.parts) add(`part:${part.id}`, AVAILABILITY[part.state]);
        try {
          localStorage.setItem(SAMPLES_KEY, JSON.stringify(sampleHistory));
        } catch {}
      }

      // --- Navegación ---
      const MORE_VIEWS = ['storage', 'network', 'settings'];

      function showView(name) {
        for (const view of document.querySelectorAll('.view')) view.hidden = view.id !== `view-${name}`;
        for (const item of document.querySelectorAll('.nav-item')) {
          if (item.dataset.view === name) item.setAttribute('aria-current', 'page');
          else item.removeAttribute('aria-current');
        }
        if (MORE_VIEWS.includes(name)) $('nav-more').setAttribute('aria-current', 'page');
        else $('nav-more').removeAttribute('aria-current');
        document.body.dataset.view = name;
        setDrawer(false);
        setMoreMenu(false);
        window.scrollTo(0, 0);
      }

      /** Celular: el menú "Más" de la barra de abajo. */
      function setMoreMenu(open) {
        $('more-menu').hidden = !open;
        $('nav-more').setAttribute('aria-expanded', String(open));
      }

      /** Desde una fila de Overview: lleva a su tarjeta en Services y la marca. */
      function showPart(id) {
        showView('services');
        const card = document.querySelector(`#parts [data-part="${id}"]`);
        if (!card) return;
        card.classList.remove('flash');
        void card.offsetWidth;
        card.classList.add('flash');
        const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
        card.scrollIntoView({ block: 'center', behavior: reduced ? 'auto' : 'smooth' });
      }

      function setDrawer(open) {
        document.body.classList.toggle('nav-open', open);
        $('scrim').hidden = !open;
        $('menu-toggle').setAttribute('aria-expanded', String(open));
      }

      function setUpChrome() {
        for (const node of document.querySelectorAll('[data-icon]')) node.replaceWith(icon(node.dataset.icon, Number(node.dataset.size ?? 19)));
        for (const node of document.querySelectorAll('[data-brand]')) node.replaceChildren(...brand(node.dataset.brand));
        document.title = PRODUCT_NAME;
        for (const item of document.querySelectorAll('.nav-item')) item.addEventListener('click', () => showView(item.dataset.view));
        $('menu-toggle').addEventListener('click', () => setDrawer(!document.body.classList.contains('nav-open')));
        $('scrim').addEventListener('click', () => setDrawer(false));
        $('nav-more').addEventListener('click', (event) => {
          event.stopPropagation();
          setMoreMenu($('more-menu').hidden);
        });
        document.addEventListener('click', (event) => {
          if (!$('more-menu').hidden && !$('more-menu').contains(event.target)) setMoreMenu(false);
        });
        document.addEventListener('keydown', (event) => {
          if (event.key === 'Escape') {
            setDrawer(false);
            setMoreMenu(false);
          }
        });
        showView('overview');
        renderMetrics(null);
        tickClock();
        setInterval(tickClock, CLOCK_MS);
      }

      function tickClock() {
        const now = new Date();
        $('clock-time').textContent = now.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', hour12: false });
        $('clock-date').textContent = now.toLocaleDateString('es-AR', { day: 'numeric', month: 'short', year: 'numeric' });
        if (!gateOpen) $('updated').textContent = lastUpdateText(lastStatusAt, now.getTime());
      }

      // --- Formularios ---
      function field(label, type = 'text', value = '') {
        const input = el('input');
        input.type = type;
        input.value = value;
        input.autocomplete = 'off';
        input.autocapitalize = 'off';
        input.spellcheck = false;
        return { input, node: el('label', 'field', label, input) };
      }

      function actionButton(label, onClick, primary = false) {
        const button = el('button', primary ? 'button primary' : 'button', label);
        button.type = 'button';
        button.addEventListener('click', onClick);
        return button;
      }

      /** Corre una acción de formulario: desactiva el botón y muestra el error en pantalla. */
      async function runForm(button, errorNode, action, busyLabel) {
        const label = button.textContent;
        button.disabled = true;
        button.textContent = busyLabel;
        errorNode.textContent = '';
        try {
          await action();
        } catch (error) {
          errorNode.textContent = error.message || 'Algo falló';
        } finally {
          button.disabled = false;
          button.textContent = label;
        }
      }

      // --- Arranque ---
      const REFRESH_MS = 15000;
      const CLOCK_MS = 5000;

      const $ = (id) => document.getElementById(id);
      let lastStatus = null;
      let lastStatusAt = null;
      let loading = false;
      let refreshAgain = false;
      let gateOpen = false;
      let downloadsBusy = false;
      let downloadsResult = null;
      const busyParts = new Map();
      const actionResults = new Map();
      const shownStates = new Map();
      const ACTION_RESULT_MS = 60000;
      const BULK_CONCURRENCY = 3;

      /**
       * Android: los íconos de la barra de estado y de navegación siguen el tema de la app, no el del dispositivo.
       * Con el celu en modo claro, Capacitor los ponía negros sobre el fondo oscuro de la app y no se veían.
       * Usa el plugin SystemBars que trae Capacitor; "DARK" es para fondos oscuros, con íconos claros.
       */
      function syncSystemBars(theme) {
        if (!window.Capacitor?.nativePromise) return;
        window.Capacitor.nativePromise('SystemBars', 'setStyle', { style: theme === 'light' ? 'LIGHT' : 'DARK' }).catch(() => {});
      }

      function setUpTheme() {
        const key = 'lp-media-center:tema';
        $('theme').value = document.documentElement.dataset.theme === 'light' ? 'light' : 'dark';
        syncSystemBars($('theme').value);
        $('theme').addEventListener('change', () => {
          const value = $('theme').value;
          if (value === 'light') document.documentElement.dataset.theme = value;
          else delete document.documentElement.dataset.theme;
          syncSystemBars(value);
          try {
            localStorage.setItem(key, value);
          } catch {}
        });
      }

      async function toggleDownloads(paused) {
        downloadsBusy = true;
        downloadsResult = null;
        renderDownloads($('downloads'), lastStatus.downloads, lastStatus.paused);
        let result;
        try {
          result = await requestDownloads(paused ? 'resume' : 'pause');
        } catch {
          result = { ok: false, message: 'No llegó la respuesta de la PC' };
        }
        downloadsBusy = false;
        downloadsResult = { ...result, until: Date.now() + ACTION_RESULT_MS };
        await refresh();
      }

      function updateBulkButtons() {
        const parts = lastStatus?.parts ?? [];
        const blocked = busyParts.size > 0 || $('content').classList.contains('stale');
        $('stop-all').disabled = blocked || partsForAction(parts, 'stop').length === 0;
        $('start-all').disabled = blocked || partsForAction(parts, 'start').length === 0;
      }

      function runPartAction(part, action) {
        const verb = actionLabel('stop', false, part.control.kind);
        if (action === 'stop' && !window.confirm(`¿${verb} ${part.name}?\n\n${part.control.stopWarning}`)) return;
        performPartAction(part, action);
      }

      function runAllParts(action) {
        const parts = partsForAction(lastStatus.parts, action);
        if (action === 'stop') {
          const names = parts.map((part) => part.name).join(', ');
          const question = `¿Apagar todo?\n\nSe frenan: ${names}.\n\nDeja de funcionar lo que dependa de ellos hasta que los prendas. Tailscale y este panel siguen andando, para poder prender todo de nuevo.`;
          if (!window.confirm(question)) return;
        }
        // De a pocos: el navegador abre 6 conexiones por servidor, y el estado tiene que seguir actualizándose.
        for (const part of parts) markPartBusy(part, action);
        const pending = [...parts];
        const worker = async () => {
          while (pending.length) await performPartAction(pending.shift(), action);
        };
        for (let i = 0; i < BULK_CONCURRENCY; i += 1) worker();
      }

      function markPartBusy(part, action) {
        busyParts.set(part.id, action);
        actionResults.delete(part.id);
        renderPartViews(lastStatus);
        updateBulkButtons();
      }

      async function performPartAction(part, action) {
        markPartBusy(part, action);
        let result;
        try {
          result = await requestPartAction(part.id, action);
        } catch {
          result = { ok: false, message: 'No llegó la respuesta de la PC' };
        }
        busyParts.delete(part.id);
        actionResults.set(part.id, { ...result, until: Date.now() + ACTION_RESULT_MS });
        await refresh();
      }

      function showBanner(title, text) {
        const heading = document.createElement('strong');
        heading.textContent = title;
        const body = document.createElement('span');
        body.textContent = text;
        $('banner').replaceChildren(heading, body);
        $('banner').hidden = false;
      }

      function seerrPart() {
        return lastStatus?.parts.find((part) => part.id === 'seerr');
      }

      function openSeerr() {
        const part = seerrPart();
        if (!part?.port) return;
        if (isMobile) openInBrowser(serviceUrl(part.port));
        else window.open(serviceUrl(part.port), '_blank');
      }

      /** El encabezado refleja el estado real. */
      function setGlobal(level, title, text) {
        $('global').dataset.level = level;
        $('headline').textContent = title;
        $('summary').textContent = text;
      }

      /** Las vistas donde hay tarjetas con botones de programas. */
      function renderPartViews(status) {
        renderParts($('parts'), status.parts);
        renderNetwork($('network'), status);
      }

      /** Avisa lo que cambió sin que nadie lo pidiera: lo pedido ya muestra su resultado en la tarjeta. */
      function announceChanges(parts) {
        for (const part of parts) {
          const message = describeChange(part, shownStates.get(part.id));
          shownStates.set(part.id, part.state);
          if (message && !actionResults.has(part.id)) notify(message, partColor(part));
        }
      }

      function render(status) {
        recordSamples(status);
        renderOverview(status);
        renderDownloadsActivity(status);
        renderDownloads($('downloads'), status.downloads, status.paused);
        renderRequests($('requests'), status.requests);
        renderPartViews(status);
        renderStorageSummary(status.disks);
        renderDisks($('disks'), status.disks);
        $('downloads-meta').textContent = downloadsMeta(status.downloads);
        $('requests-meta').textContent = requestsMeta(status.requests);
        $('parts-meta').textContent = partsMeta(status.parts);
        $('disks-meta').textContent = disksMeta(status.disks);
        const global = globalStatus(status.parts, status.disks);
        setGlobal(global.level, global.title, global.text);
        announceChanges(status.parts);
        lastStatusAt = Date.now();
        tickClock();
      }

      function showFailure(error) {
        if (isMobile && !lastStatus && !error.reachable) {
          showSearch();
          return;
        }
        const retry = `Sigo reintentando cada ${REFRESH_MS / 1000} segundos.`;
        const since = lastStatus ? ` Lo de abajo es de las ${formatClock(lastStatus.generatedAt)}.` : '';
        if (error.reachable) {
          showBanner('El backend de la PC respondió con un error', `${retry}${since}`);
        } else {
          showBanner(
            'No llego a la PC',
            `Revisá que esté prendida y con el backend iniciado. ${retry}${since}`,
          );
        }
        setGlobal('down', error.reachable ? 'El backend respondió con un error' : 'No llego a la PC', 'Sin conexión con la PC');
        $('content').classList.add('stale');
        $('open-seerr').disabled = true;
        for (const button of document.querySelectorAll('.part-action, .open-service, .needs-pc')) button.disabled = true;
        for (const badge of document.querySelectorAll('.live')) {
          badge.classList.add('off');
          badge.textContent = NO_DATA;
        }
        updateBulkButtons();
      }

      /** Pantallas del celular que reemplazan al panel: emparejar, iniciar sesión o buscar. */
      function showGate(...children) {
        gateOpen = true;
        document.body.classList.add('gated');
        $('banner').hidden = true;
        $('content').hidden = true;
        $('gate').replaceChildren(el('article', 'card', ...children));
        $('gate').hidden = false;
        $('updated').textContent = '';
      }

      function closeGate() {
        gateOpen = false;
        document.body.classList.remove('gated');
        $('gate').hidden = true;
        $('content').hidden = false;
      }

      /** `prefill` viene del QR: código y, si lo trae, la dirección de la PC. */
      function showPairing(prefill = null) {
        $('summary').textContent = 'Primera vez en este celular';
        const name = field('Nombre de este dispositivo', 'text', mobile.name ?? '');
        name.input.placeholder = 'Por ejemplo, Tablet del living';
        name.input.maxLength = 60;
        name.input.autocapitalize = 'sentences';
        const code = field('Código', 'text', prefill?.code ?? '');
        const host = field('Dirección de la PC (LAN o Tailscale)', 'text', prefill?.host ?? '');
        host.input.placeholder = 'Vacío: la busca en el Wi-Fi';
        const error = el('p', 'form-error');
        const pair = () =>
          runForm(button, error, async () => {
            mobile.name = name.input.value.trim();
            saveMobile();
            await pairWithCode(code.input.value, host.input.value, name.input.value);
            showLogin();
          }, 'Buscando la PC…');
        const button = actionButton('Emparejar', pair, true);
        /** Con el código cargado, empareja solo si ya hay nombre; si no, lo pide. */
        const pairWhenNamed = () => {
          if (name.input.value.trim()) return pair();
          error.textContent = 'Código cargado. Poné un nombre para este dispositivo y tocá Emparejar.';
          name.input.focus();
        };
        const scan = actionButton('Escanear QR', async () => {
          error.textContent = '';
          let text;
          try {
            text = await scanQr();
          } catch (problem) {
            error.textContent = problem.message || 'No se pudo abrir el lector de QR';
            return;
          }
          if (text === null) return;
          const link = parsePairLink(text);
          if (!link) {
            error.textContent = 'Ese QR no es para emparejar. Usá el que muestra la app de Windows.';
            return;
          }
          code.input.value = link.code;
          host.input.value = link.host;
          await pairWhenNamed();
        });
        scan.hidden = !canScanQr();
        showGate(
          el('h2', null, 'Emparejar con la PC'),
          el('p', 'muted small', 'En la app de Windows, abrí Settings, "Celulares" y tocá "Emparejar un celular". Escaneá el QR o escribí el código. Con el celu en el Wi-Fi de casa, la PC se busca sola.'),
          name.node,
          code.node,
          host.node,
          el('div', 'row-actions', button, scan),
          error,
        );
        if (prefill && !name.input.value.trim()) pairWhenNamed();
      }

      const canScanQr = () => isMobile && Boolean(window.Capacitor?.nativePromise);

      /** Abre el lector de QR de Android. Devuelve el texto, o null si se canceló. */
      async function scanQr() {
        const result = await window.Capacitor.nativePromise('LpNetwork', 'scanQr', {});
        return result.canceled ? null : result.text ?? null;
      }

      /** Si la cámara del celular abrió la app con el QR, trae el enlace, una sola vez. */
      async function takePairLink() {
        if (!window.Capacitor?.nativePromise) return null;
        try {
          return parsePairLink((await window.Capacitor.nativePromise('LpNetwork', 'takePairLink', {})).url);
        } catch {
          return null;
        }
      }

      /** Lleva a emparejar con lo que trae el QR. No empareja solo: lo confirma la persona con el botón. */
      async function handlePairLink() {
        const link = await takePairLink();
        if (!link) return false;
        if (mobile.deviceId) {
          if (!window.confirm('Este dispositivo ya está emparejado con una PC. ¿Emparejarlo de nuevo con el código del QR?')) return true;
          await logout();
          forgetPc();
        }
        showPairing(link);
        return true;
      }

      function showLogin() {
        $('summary').textContent = 'Conectado a la PC';
        const user = field('Usuario');
        const password = field('Contraseña', 'password');
        const error = el('p', 'form-error');
        const button = actionButton('Entrar', async () => {
          await runForm(button, error, async () => {
            await login(user.input.value.trim(), password.input.value);
            closeGate();
            await refresh();
          }, 'Entrando…');
        }, true);
        showGate(
          el('h2', null, 'Iniciar sesión'),
          el('p', 'muted small', 'Usá el usuario y la contraseña que creaste en la app de Windows.'),
          user.node,
          password.node,
          el('div', 'row-actions', button, actionButton('Olvidar esta PC', confirmForget)),
          error,
        );
      }

      function showSearch(message) {
        $('summary').textContent = 'Sin conexión con la PC';
        const host = field('Dirección de la PC (LAN o Tailscale)');
        host.input.placeholder = 'Vacío: la busca en el Wi-Fi';
        const error = el('p', 'form-error', message ?? '');
        const search = actionButton('Buscar PC', async () => {
          await runForm(search, error, async () => {
            const typed = normalizeHost(host.input.value);
            const found = typed ? ((await isOurPc(typed, REQUEST_TIMEOUT_MS)) && (usePc(typed), typed)) : await findPc({ force: true });
            if (!found) throw new Error('No la encontré. Revisá que la PC esté prendida y el celu en su red, o conectate a Tailscale.');
            enterPanel();
          }, 'Buscando…');
        }, true);
        showGate(
          el('h2', null, 'No llego a la PC'),
          el('p', 'muted small', 'Buscar recorre la red a la que está conectado este celular.'),
          host.node,
          el('div', 'row-actions', search, actionButton('Olvidar esta PC', confirmForget)),
          error,
        );
      }

      function confirmForget() {
        if (!window.confirm('¿Olvidar esta PC? Vas a tener que emparejar el celular de nuevo.')) return;
        forgetPc();
        showPairing();
      }

      function enterPanel() {
        if (!mobile.token) {
          showLogin();
          return;
        }
        closeGate();
        refresh();
      }

      async function startMobile() {
        $('connection-section').hidden = false;
        if (await handlePairLink()) return;
        if (!mobile.deviceId) {
          showPairing();
          return;
        }
        $('summary').textContent = 'Buscando la PC…';
        if (await findPc()) enterPanel();
        else showSearch();
      }

      function renderConnection() {
        // No pisar lo que se está escribiendo con cada actualización.
        const typing = $('connection').querySelector('input');
        if (typing && (typing.value || document.activeElement === typing)) return;
        const via = isTailscaleHost(pcHost) ? 'Tailscale' : 'red local';
        $('connection-meta').textContent = pcHost ? 'Por ' + via : 'Sin conexión';
        const error = el('p', 'form-error');
        const search = actionButton('Buscar PC', async () => {
          await runForm(search, error, async () => {
            if (!(await findPc({ force: true }))) throw new Error('No la encontré');
            await refresh();
          }, 'Buscando…');
        });
        const host = field('Dirección de la PC (LAN o Tailscale)');
        const connect = actionButton('Conectar', async () => {
          await runForm(connect, error, async () => {
            const typed = normalizeHost(host.input.value);
            if (!isAllowedPcHost(typed)) throw new Error('Esa dirección no es de una red privada ni de Tailscale');
            if (!(await isOurPc(typed, REQUEST_TIMEOUT_MS))) throw new Error('No llegué a la PC en ' + typed);
            usePc(typed);
            host.input.value = '';
            await refresh();
          }, 'Conectando…');
        }, true);
        const leave = actionButton('Cerrar sesión', async () => {
          await logout();
          showLogin();
        });
        $('connection').replaceChildren(
          el(
            'article',
            'card',
            el('p', 'small', pcHost ? 'Conectado a ' + pcHost + ' por ' + via : 'Sin conexión'),
            host.node,
            el('div', 'row-actions', connect, search, leave, actionButton('Olvidar esta PC', confirmForget)),
            error,
          ),
        );
      }

      // --- Celulares, solo en la app de Windows ---
      /** Código para el celular, para copiar o escanear. El QR lleva también la dirección de la PC. */
      /** QR negro sobre blanco, dibujado con el generador propio de la sección "QR". */
      function qrImage(text, label) {
        const { path, size } = qrSvgPath(qrMatrix(text));
        const qr = svgNode('svg', {
          class: 'pair-qr',
          viewBox: '0 0 ' + size + ' ' + size,
          role: 'img',
          'aria-label': label,
          'shape-rendering': 'crispEdges',
        });
        qr.append(svgNode('path', { d: path, fill: '#000' }));
        return qr;
      }

      function copyButton(value, title, message) {
        const copy = el('button', 'icon-button', icon('copy', 16));
        copy.type = 'button';
        copy.title = title;
        copy.setAttribute('aria-label', title);
        copy.addEventListener('click', () => copyText(copy, value, message));
        return copy;
      }

      function pairCodeBlock(code, host) {
        return el(
          'div',
          'pair-box',
          qrImage(pairLink(code, host), 'QR para emparejar un celular'),
          el('div', 'pair-code-row', el('span', 'pair-code', code), copyButton(code, 'Copiar el código', 'Código copiado')),
        );
      }

      // Siempre la última versión publicada: GitHub redirige este enlace al APK de la release más nueva.
      const APK_DOWNLOAD_URL = 'https://github.com/mmunozpatino/lp-media-center/releases/latest/download/LP-Cine-Vault.apk';

      /** Para un celular que todavía no tiene la app: QR con la descarga del APK, y el enlace para copiarlo. */
      function apkDownloadCard() {
        return el(
          'article',
          'card',
          el('h3', null, 'Bajar la app del celular'),
          el('p', 'muted small', 'Si el celu o la tablet todavía no tiene ' + PRODUCT_NAME + ', escaneá el QR con la cámara para bajar la última versión. Al abrir el APK, Android pide permitir instalar apps desde el navegador.'),
          el(
            'div',
            'pair-box',
            qrImage(APK_DOWNLOAD_URL, 'QR para bajar la app del celular'),
            el('div', 'pair-code-row', el('span', 'apk-link muted small', 'github.com/…/LP-Cine-Vault.apk'), copyButton(APK_DOWNLOAD_URL, 'Copiar el enlace', 'Enlace copiado')),
          ),
          el('div', 'row-actions', actionButton('Abrir en el navegador', () => openInBrowser(APK_DOWNLOAD_URL))),
        );
      }

      async function setupRequest(path, body) {
        const response = await apiRequest(pcHost, path, { method: body ? 'POST' : 'GET', body });
        const json = await response.json();
        if (!response.ok) throw new Error(json.error ?? 'No se pudo');
        return json;
      }

      async function loadDevices(shownCode = null) {
        let setup;
        try {
          setup = await setupRequest('/api/setup');
        } catch {
          $('devices').replaceChildren(issueList(['No se pudo leer la configuración de celulares'], true));
          return;
        }
        const count = setup.devices.length;
        $('devices-meta').textContent = !setup.hasPassword ? 'Falta crear la contraseña' : count === 1 ? '1 emparejado' : count + ' emparejados';

        const error = el('p', 'form-error');
        const cards = [];

        const user = field('Usuario', 'text', setup.user ?? '');
        const password = field(setup.hasPassword ? 'Contraseña nueva' : 'Contraseña', 'password');
        const repeat = field('Repetir contraseña', 'password');
        const save = actionButton(setup.hasPassword ? 'Cambiar contraseña' : 'Crear contraseña', async () => {
          await runForm(save, error, async () => {
            if (password.input.value !== repeat.input.value) throw new Error('Las contraseñas no coinciden');
            await setupRequest('/api/setup/password', { user: user.input.value, password: password.input.value });
            await loadDevices();
          }, 'Guardando…');
        }, !setup.hasPassword);
        cards.push(
          el(
            'article',
            'card',
            el('h3', null, setup.hasPassword ? 'Contraseña del panel' : 'Primero, creá la contraseña del panel'),
            el('p', 'muted small', 'La pide el celular para entrar. En esta PC no hace falta. Cambiarla cierra las sesiones de los celulares.'),
            user.node,
            password.node,
            repeat.node,
            el('div', 'row-actions', save),
          ),
        );

        const pair = actionButton('Emparejar un celular', async () => {
          await runForm(pair, error, async () => loadDevices(await setupRequest('/api/setup/pairing', {})), 'Creando…');
        }, setup.hasPassword);
        pair.disabled = !setup.hasPassword;
        const network = lastStatus?.network;
        const pcAddress = network?.lanIp ?? network?.tailscaleIp ?? null;
        cards.push(
          el(
            'article',
            'card',
            el('h3', null, 'Agregar un celular'),
            shownCode ? pairCodeBlock(shownCode.code, pcAddress) : null,
            shownCode
              ? el('p', 'muted small', 'En la app del celular, tocá "Escanear QR" o escribí el código. Sirve una sola vez y vence en 10 minutos. Si el celu no encuentra la PC, usá la dirección ' + (network?.lanIp ?? 'de LAN') + (network?.tailscaleIp ? ' o, por Tailscale, ' + network.tailscaleIp : '') + '.')
              : el('p', 'muted small', 'Crea un código de un solo uso para escribir en el celular.'),
            el('div', 'row-actions', pair),
          ),
          apkDownloadCard(),
        );

        for (const device of setup.devices) {
          const info = el('div', null, el('h3', null, device.name), el('p', 'muted small', 'Desde el ' + new Date(device.createdAt).toLocaleDateString('es-AR')));
          const rename = actionButton('Cambiar nombre', () => {
            const name = field('Nombre', 'text', device.name);
            name.input.maxLength = 60;
            const save = actionButton('Guardar', async () => {
              await runForm(save, error, async () => {
                await setupRequest('/api/setup/devices/' + device.id + '/rename', { name: name.input.value });
                await loadDevices();
              }, 'Guardando…');
            }, true);
            const cancel = actionButton('Cancelar', () => loadDevices());
            name.input.addEventListener('keydown', (event) => {
              if (event.key === 'Enter') save.click();
              if (event.key === 'Escape') cancel.click();
            });
            info.replaceChildren(name.node, el('div', 'row-actions', save, cancel));
            rename.hidden = true;
            name.input.focus();
            name.input.select();
          });
          const remove = actionButton('Quitar', async () => {
            if (!window.confirm('¿Quitar ' + device.name + '? Va a tener que emparejarse de nuevo.')) return;
            await runForm(remove, error, async () => {
              await setupRequest('/api/setup/devices/' + device.id + '/remove', {});
              await loadDevices();
            }, 'Quitando…');
          });
          cards.push(
            el(
              'article',
              'card device-row',
              info,
              el('div', 'row-actions', rename, remove),
            ),
          );
        }
        $('devices').replaceChildren(el('div', 'stack', ...cards, error));
      }

      async function refresh() {
        if (gateOpen) return;
        if (loading) {
          refreshAgain = true;
          return;
        }
        loading = true;
        $('refresh').disabled = true;
        try {
          lastStatus = await fetchStatus();
          if (isMobile) await rememberNetwork(lastStatus.network);
          render(lastStatus);
          if (isMobile) renderConnection();
          $('banner').hidden = true;
          $('content').classList.remove('stale');
          $('open-seerr').disabled = seerrPart()?.state === 'down';
          updateBulkButtons();
        } catch (error) {
          if (error.unauthorized) {
            mobile.token = null;
            saveMobile();
            showLogin();
          } else {
            showFailure(error);
            // La IP de la PC pudo cambiar: se busca de nuevo.
            if (isMobile && !error.reachable && (await findPc())) refreshAgain = true;
          }
        } finally {
          loading = false;
          $('refresh').disabled = false;
        }
        if (refreshAgain) {
          refreshAgain = false;
          await refresh();
        }
      }

      $('refresh').addEventListener('click', refresh);
      $('stop-all').addEventListener('click', () => runAllParts('stop'));
      $('start-all').addEventListener('click', () => runAllParts('start'));
      $('open-seerr').addEventListener('click', openSeerr);

      setInterval(() => {
        if (!document.hidden) refresh();
      }, REFRESH_MS);
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) refresh();
        if (!document.hidden && isMobile) handlePairLink();
      });
      const UPDATE_EVERY_MS = 6 * 60 * 60 * 1000;
      const SKIPPED_UPDATE_KEY = 'lp-media-center:actualizacion-omitida';

      /** manual: la pidió la usuaria desde Settings, así que muestra el aviso aunque haya tocado "Más tarde". */
      async function checkForUpdate({ manual = false } = {}) {
        const update = await findUpdate();
        let skipped = null;
        try {
          skipped = localStorage.getItem(SKIPPED_UPDATE_KEY);
        } catch {}
        if (update.state !== 'available' || (!manual && update.version === skipped)) {
          // Un error de red no esconde un aviso que ya estaba a la vista.
          if (update.state !== 'error') $('update').hidden = true;
          return update;
        }
        showUpdateBanner(update);
        return update;
      }

      // Las apps saben bajar e instalar solas la versión nueva: Windows con electron/updater.cjs, en silencio, y
      // Android con AppUpdater.java, que abre el cartel de instalación de Android (siempre pide confirmar).
      const canDesktopUpdate = () => typeof window.lpDesktop?.installUpdate === 'function';
      const canAndroidUpdate = () => isMobile && typeof window.Capacitor?.nativeCallback === 'function';
      const canSelfUpdate = () => canDesktopUpdate() || canAndroidUpdate();

      /** Android: el plugin responde varias veces, con el avance y al final con "installing" o "permission". */
      function androidInstallUpdate(onProgress) {
        return new Promise((resolve, reject) => {
          window.Capacitor.nativeCallback('LpNetwork', 'installUpdate', {}, (result, error) => {
            if (error) reject(new Error(error.message || 'No se pudo actualizar.'));
            else if (result?.state === 'progress') onProgress(result);
            else resolve(result ?? {});
          });
        });
      }

      /** { state: 'installing' } cuando arrancó la instalación, o { state: 'permission' } si Android pide permiso antes. */
      async function selfUpdate(onProgress) {
        if (!canDesktopUpdate()) return androidInstallUpdate(onProgress);
        await window.lpDesktop.installUpdate(onProgress);
        return { state: 'installing' };
      }

      /**
       * El botón de la versión nueva. En Windows instalada: "Actualizar ahora", que baja e instala sola y muestra el
       * avance en `statusNode`. Si falla, ofrece bajarla a mano. En el resto: "Descargar", que abre el navegador.
       */
      function updateButton(update, statusNode) {
        if (!canSelfUpdate()) return actionButton('Descargar', () => openInBrowser(update.url), true);
        const button = actionButton('Actualizar ahora', async () => {
          button.disabled = true;
          button.textContent = 'Bajando…';
          statusNode.replaceChildren();
          try {
            const result = await selfUpdate(({ received, total }) => {
              button.textContent = total ? `Bajando… ${Math.floor((received / total) * 100)}%` : 'Bajando…';
            });
            if (result.state === 'permission') {
              button.disabled = false;
              button.textContent = 'Actualizar ahora';
              statusNode.textContent =
                'Android pide permiso una sola vez: en el ajuste que se abrió, activá "Permitir de esta fuente", volvé y tocá "Actualizar ahora" otra vez.';
            } else if (canDesktopUpdate()) {
              button.textContent = 'Instalando…';
              statusNode.textContent = 'La app se cierra y vuelve a abrir sola en unos segundos.';
            } else {
              // Si se cancela el cartel de Android, se puede volver a tocar.
              button.disabled = false;
              button.textContent = 'Actualizar ahora';
              statusNode.textContent = 'Confirmá "Actualizar" en el cartel de Android. Cuando termine, abrí la app de nuevo.';
            }
          } catch (error) {
            button.disabled = false;
            button.textContent = 'Reintentar';
            statusNode.replaceChildren(
              el('span', null, (error.message || 'No se pudo actualizar.') + ' '),
              actionButton('Bajarla a mano', () => openInBrowser(update.url)),
            );
          }
        }, true);
        return button;
      }

      function showUpdateBanner(update) {
        const how = isMobile
          ? canSelfUpdate()
            ? 'Se baja sola y Android te pide confirmar la instalación, sin perder el emparejamiento.'
            : 'Se descarga el APK: abrilo para instalarlo encima, sin perder el emparejamiento.'
          : canSelfUpdate()
            ? 'Se baja y se instala sola: la app se cierra un momento y vuelve a abrir.'
            : 'Se descarga el instalador: al abrirlo, cierra la app, la actualiza y la vuelve a abrir.';
        const later = actionButton('Más tarde', () => {
          try {
            localStorage.setItem(SKIPPED_UPDATE_KEY, update.version);
          } catch {}
          $('update').hidden = true;
        });
        const { titles, more } = update.notes;
        const notes = titles.length
          ? el('ul', 'update-notes', ...titles.map((title) => el('li', null, title)), more ? el('li', 'muted', 'Y ' + changeCount(more) + ' más') : null)
          : null;
        const status = el('p', 'update-status muted small');
        $('update').replaceChildren(
          el('div', 'update-text', el('p', null, el('strong', null, 'Hay una versión nueva: ' + update.version + '. '), how), notes, status),
          updateButton(update, status),
          later,
        );
        $('update').hidden = false;
      }

      /** Settings, "Versión": la de esta app y el botón para buscar una más nueva. */
      async function setUpVersionSettings() {
        const info = await loadBuildInfo();
        const button = $('check-update');
        const result = $('check-update-result');
        if (!info?.version) {
          $('app-version').textContent = 'Versión de desarrollo';
          result.textContent = 'Las versiones de desarrollo no buscan actualizaciones.';
          button.hidden = true;
          return;
        }
        $('app-version').textContent = 'Versión ' + info.version;
        button.addEventListener('click', async () => {
          button.disabled = true;
          button.textContent = 'Buscando…';
          result.replaceChildren();
          const update = await checkForUpdate({ manual: true });
          button.disabled = false;
          button.textContent = 'Buscar actualizaciones';
          if (update.state === 'available') {
            const status = el('span', 'update-status');
            result.replaceChildren(el('span', null, 'Hay una versión nueva: ' + update.version + '. '), updateButton(update, status), status);
          } else if (update.state === 'current') {
            result.textContent = 'Ya tenés la última versión.';
          } else {
            result.textContent = 'No se pudo consultar GitHub. Revisá la conexión a internet y probá de nuevo.';
          }
        });
      }

      // --- Novedades ---
      // changelog.json viaja dentro de la app con los cambios de cada versión, para verlos sin internet. Al
      // abrir una versión nueva, un diálogo cuenta qué cambió desde la última que se vio en este equipo.
      const NEWS_SEEN_KEY = 'lp-media-center:novedades-vistas';
      // En la app solo se ven las novedades de la versión actual; el historial completo está en GitHub.
      const RELEASES_PAGE = 'https://github.com/mmunozpatino/lp-media-center/releases';

      const allVersionsButton = () => actionButton('Ver versiones anteriores en GitHub', () => openInBrowser(RELEASES_PAGE));

      function newsVersion(entry, heading) {
        const date = changelogDate(entry.date);
        return el(
          'section',
          'news-version',
          heading ? el('div', 'news-version-head', el(heading, null, 'Versión ' + entry.version), date ? el('span', 'muted small', date) : null) : null,
          el(
            'ul',
            'news-changes',
            ...entry.changes.map((change) =>
              el('li', null, el('strong', null, change.title), ...(change.body ? change.body.split(/\n\n+/).map((text) => el('p', 'muted', text)) : [])),
            ),
          ),
        );
      }

      /** Settings, "Novedades": lo que trajo la versión instalada, y un enlace a GitHub para las anteriores. */
      function renderNewsSettings(info, versions) {
        const entry = versions.find((item) => item.version === info?.version) ?? null;
        if (!entry?.changes.length) {
          const text = info?.version
            ? 'Esta versión no trae la lista de novedades.'
            : 'Las novedades vienen con cada versión publicada. Esta es de desarrollo.';
          $('news').replaceChildren(el('article', 'card', el('p', 'muted', text), el('div', 'row-actions', allVersionsButton())));
          return;
        }
        $('news').replaceChildren(
          el('article', 'card news-item', newsVersion(entry, 'h3'), el('div', 'row-actions', allVersionsButton())),
        );
      }

      function showNewsDialog(versions, current) {
        const dialog = $('news-dialog');
        const done = actionButton('Listo', () => dialog.close(), true);
        $('news-title').textContent = newsTitle(versions);
        $('news-list').replaceChildren(...versions.map((entry) => newsVersion(entry, versions.length > 1 ? 'h3' : null)));
        $('news-actions').replaceChildren(allVersionsButton(), done);
        // Se da por vista al cerrarlo de cualquier forma: con "Listo" o con Escape.
        dialog.addEventListener(
          'close',
          () => {
            try {
              localStorage.setItem(NEWS_SEEN_KEY, current);
            } catch {}
          },
          { once: true },
        );
        dialog.showModal();
        done.focus();
      }

      async function setUpNews() {
        const [info, data] = await Promise.all([loadBuildInfo(), bundledJson('changelog.json')]);
        const versions = changelogVersions(data);
        renderNewsSettings(info, versions);
        if (!info?.version) return;
        let lastSeen;
        try {
          lastSeen = localStorage.getItem(NEWS_SEEN_KEY);
        } catch {
          return; // Sin dónde guardar que se vio, mejor no mostrarlo en cada arranque.
        }
        // Solo la versión instalada, aunque se haya salteado alguna: las anteriores están en GitHub.
        const news = newsToShow(versions, info.version, lastSeen).filter((entry) => entry.version === info.version);
        if (news.length) {
          showNewsDialog(news, info.version);
        } else if (!lastSeen || isNewerVersion(info.version, lastSeen)) {
          try {
            localStorage.setItem(NEWS_SEEN_KEY, info.version);
          } catch {}
        }
      }

      setTimeout(checkForUpdate, 5000);
      setInterval(checkForUpdate, UPDATE_EVERY_MS);
      setUpChrome();
      setUpTheme();
      setUpNews();
      setUpVersionSettings();
      if (isMobile) {
        startMobile();
      } else {
        $('devices-section').hidden = false;
        refresh().then(() => loadDevices());
      }
    </script>
  </body>
</html>
